name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da versão da release (ex: v2.2.4)'
        required: false
        default: 'v2.2.4'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build -w @np/shared

      - name: Determine Release Tag
        id: vars
        run: |
          TAG_INPUT="${{ github.event.inputs.release_tag }}"
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v2.2.4"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building APK for tag: $TAG"

      - name: Compile Android APK
        env:
          EXPO_PUBLIC_API_URL: https://eleicoes-progressistas.onrender.com
          EXPO_PUBLIC_PIX_KEY: "(21) 97194-3298"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          cd apps/mobile
          OUTPUT_APK="eleicoes-progressistas-${{ steps.vars.outputs.tag }}-beta.apk"

          # Se houver EXPO_TOKEN configurado, tenta compilar localmente via EAS CLI (aproveitando a keystore remota)
          if [ -n "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN detectado. Tentando compilação local com EAS CLI..."
            if npx eas-cli build --platform android --profile preview --local --non-interactive --output="$OUTPUT_APK"; then
              echo "Build via EAS local concluído com sucesso!"
              exit 0
            else
              echo "Aviso: EAS local falhou, prosseguindo com Expo Prebuild + Gradle..."
            fi
          fi

          echo "Compilando via Expo Prebuild e Gradle..."
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          # Localizar o APK gerado pelo Gradle
          BUILT_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            echo "Erro: Nenhum APK encontrado após o build do Gradle."
            exit 1
          fi

          cp "$BUILT_APK" "../$OUTPUT_APK"
          echo "APK copiado para apps/mobile/$OUTPUT_APK com sucesso."

      - name: Compute Integrity Checksum (SHA-256)
        id: checksum
        run: |
          cd apps/mobile
          APK_FILE="eleicoes-progressistas-${{ steps.vars.outputs.tag }}-beta.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "Erro: $APK_FILE não existe."
            exit 1
          fi
          SHA256=$(sha256sum "$APK_FILE" | cut -d ' ' -f 1)
          echo "$SHA256" > sha256.txt
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "=================================================="
          echo "ARQUIVO: $APK_FILE"
          echo "SHA-256: $SHA256"
          echo "=================================================="

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eleicoes-progressistas-${{ steps.vars.outputs.tag }}-apk
          path: |
            apps/mobile/eleicoes-progressistas-${{ steps.vars.outputs.tag }}-beta.apk
            apps/mobile/sha256.txt
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          APK_FILE="apps/mobile/eleicoes-progressistas-${TAG}-beta.apk"
          SHA_FILE="apps/mobile/sha256.txt"

          echo "## 📦 Release $TAG — Beta Fechado" > release_body.md
          echo "" >> release_body.md
          echo "### 🔐 Verificação de Integridade" >> release_body.md
          echo "- **Arquivo:** \`eleicoes-progressistas-${TAG}-beta.apk\`" >> release_body.md
          echo "- **SHA-256:** \`${{ steps.checksum.outputs.sha256 }}\`" >> release_body.md
          echo "" >> release_body.md
          echo "### 🚀 Novidades da v2.2.4:" >> release_body.md
          echo "- **Apoio Cívico via PIX Celular:** Atualizada chave PIX para celular \`(21) 97194-3298\` no padrão E.164 BACEN (\`+5521971943298\`) com cópia em 1 clique e QR Code EMVCo." >> release_body.md
          echo "- **Slogan Cívico:** Mensagem de destaque *\"Buscando Propostas e não Fofocas\"* na tela de carregamento." >> release_body.md
          echo "- **Ordenação Alfabética:** Candidatos ordenados alfabeticamente por nome de campanha dentro de cada cargo." >> release_body.md
          echo "- **Cards de Cargos Destacados:** Visual com faixa temática, elevação aprimorada e cabeçalhos fixos (*sticky*) para fácil localização na rolagem." >> release_body.md
          echo "- **Blindagem de Segurança:** Defesas de timing-safe comparisons, validação rigorosa de esquemas de URL, sanitização contra CSV injection e limites de entrada." >> release_body.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release_body.md --prerelease
          else
            gh release create "$TAG" --title "Eleições Progressistas $TAG (Beta Fechado)" --notes-file release_body.md --prerelease
          fi

          echo "Fazendo upload dos artefatos na release..."
          gh release upload "$TAG" "$APK_FILE" "$SHA_FILE" --clobber
