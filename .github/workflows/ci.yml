name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run docs:sync
      - name: Check for uncommitted doc changes
        run: |
          if [ -n "$(git status --porcelain docs/ README.md)" ]; then
            echo "Documentation is out of sync with code changes. Please run 'npm run docs:sync' locally."
            git diff docs/ README.md
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @np/shared
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @np/shared
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run typecheck

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @np/shared
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: cd apps/api && npm test
        env:
          JWT_SECRET: test-secret-ci

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cd services/matching
          pip install -r requirements.txt pytest
          pytest tests/ -v

