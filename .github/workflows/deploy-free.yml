name: Deploy Free-Tier

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build -w @np/shared

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Install Python Dependencies
        run: |
          pip install -r services/matching/requirements.txt
          pip install pytest

      - name: Lint & Sanity Check
        run: |
          npm run lint --if-present
          ! grep -rn "quiz" docs/ || (echo "Encontrada referencia a quiz em docs!" && exit 1)
          ! grep -rn "core_scores" docs/ || (echo "Encontrada referencia a core_scores em docs!" && exit 1)

      - name: Typecheck
        run: npm run typecheck

      - name: Run Jest Unit Tests (NestJS API)
        run: npm --prefix apps/api run test --if-present

      - name: Run Pytest (Matching Service)
        run: cd services/matching && pytest tests/ -v

  migrate-database:
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Prisma Migrate Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npx prisma db push --schema=apps/api/prisma/schema.prisma --skip-generate
          else
            echo "DATABASE_URL secret is not set, skipping database migration step."
          fi

  deploy-web-cloudflare:
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Shared Package
        run: npm run build -w @np/shared
      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - name: Build Web Bundle
        run: npm run build:web -w @np/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_PIX_KEY: ${{ secrets.EXPO_PUBLIC_PIX_KEY }}
      - name: Copy static pages (privacidade, beta)
        run: cp -r static/. apps/mobile/dist/
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/mobile/dist --project-name=eleicoes-progressistas

  deploy-api-render:
    needs: migrate-database
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"

  notify-sentry:
    needs: [deploy-web-cloudflare, deploy-api-render]
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Create Sentry Release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v1
        with:
          environment: production
          version: ${{ github.ref_name }}
